plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tarihinincisi.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.tarihinincisi.app'
        minSdk 24
        targetSdk 36
        // Her Play güncellemesinde versionCode'u 1 artır, versionName'i değiştir.
        versionCode 3
        versionName '1.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    // Test/deneme bitiminde tam ekran reklam (internet yoksa reklam yüklenmez, uygulama çevrimdışı çalışmaya devam eder)
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
}
