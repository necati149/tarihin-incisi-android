name: AAB Derle

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android 16 (API 36) bileşenleri
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/imza.keystore"

      - name: AAB derle
        env:
          TI_KEYSTORE: ${{ runner.temp }}/imza.keystore
          TI_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          TI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TI_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: İmzayı doğrula
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -2

      - uses: actions/upload-artifact@v4
        with:
          name: tarihin-incisi-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Anahtar dosyasını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/imza.keystore"
