name: AAB Derle

# İmzasız AAB derlenir ve "derleme" dalına yüklenir. İmza, anahtar GitHub'a
# hiç gönderilmeden ayrıca (jarsigner ile) atılır.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Android 16 (API 36) bileşenleri
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: AAB derle
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace 2>&1 | tee derleme-gunlugu.txt
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Sonucu "derleme" dalına yükle
        if: always()
        run: |
          mkdir -p /tmp/cikti
          cp derleme-gunlugu.txt /tmp/cikti/ || true
          cp app/build/outputs/bundle/release/app-release.aab /tmp/cikti/app-release-imzasiz.aab || true
          echo "${GITHUB_SHA} $(date -u +%FT%TZ) ${{ job.status }}" > /tmp/cikti/durum.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan derleme
          git rm -rfq .
          cp /tmp/cikti/* .
          git add -A
          git commit -qm "Derleme çıktısı ${GITHUB_SHA}"
          git push -f origin derleme
